name: Eval

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: '3'
        required: false
      case:
        description: Only run the case with this id (optional)
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repo_pulse
          POSTGRES_PASSWORD: repo_pulse
          POSTGRES_DB: repo_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repo_pulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://repo_pulse:repo_pulse@localhost:5432/repo_pulse_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUNS: ${{ inputs.runs }}
      CASE_ID: ${{ inputs.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create test database
        run: PGPASSWORD=repo_pulse psql -h localhost -U repo_pulse -d repo_pulse -c 'CREATE DATABASE repo_pulse_test'
      - run: npm ci
      - run: npx prisma generate
      - name: Run eval
        run: |
          args=(--runs "$RUNS")
          if [ -n "$CASE_ID" ]; then args+=(--case "$CASE_ID"); fi
          npm run eval -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval/reports
