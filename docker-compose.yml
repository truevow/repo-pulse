services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repo_pulse
      POSTGRES_PASSWORD: repo_pulse
      POSTGRES_DB: repo_pulse
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repo_pulse']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://repo_pulse:repo_pulse@db:5432/repo_pulse
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  pgdata:
